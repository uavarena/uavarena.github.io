name: Register your team
description: Sign up for the free UAV Arena practice league (January 2027)
title: "Team registration: "
labels: ["registration"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your interest in the UAV Arena practice league. This form is public, so don't include phone numbers or private details. We'll reply in this issue with next steps.
  - type: input
    id: team
    attributes:
      label: Team name
    validations:
      required: true
  - type: input
    id: university
    attributes:
      label: University or organization
    validations:
      required: true
  - type: input
    id: country
    attributes:
      label: Country and city
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Team size
      options: ["1–3", "4–8", "9–15", "More than 15"]
    validations:
      required: true
  - type: checkboxes
    id: experience
    attributes:
      label: What does your team already use?
      options:
        - label: ArduPilot or PX4
        - label: MAVLink
        - label: ROS or ROS 2
        - label: Gazebo or another simulator
        - label: Computer vision for target detection
  - type: dropdown
    id: competition
    attributes:
      label: Are you preparing for a competition?
      options: ["Yes, Savaşan İHA (Fighting UAV)", "Yes, another UAV competition", "No, practice and learning"]
    validations:
      required: true
  - type: textarea
    id: goals
    attributes:
      label: What would you most like to practise or test?
  - type: input
    id: contact
    attributes:
      label: Preferred contact (LinkedIn, Discord or a public email)
